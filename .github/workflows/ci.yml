name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Hyperkey.sln

      - name: Build solution
        run: dotnet build Hyperkey.sln --configuration Release --no-restore --property:Platform=x64

      - name: Run core tests
        run: dotnet run --project tests\Hyperkey.Core.Tests\Hyperkey.Core.Tests.csproj --configuration Release --no-build

[package]
name = "hyperkey-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
hyperkey-core = { path = "../hyperkey-core" }
hyperkey-input = { path = "../hyperkey-input" }
iced = "=0.14.0"
tray-icon = "=0.26.1"
dirs = "7"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
